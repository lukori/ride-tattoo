<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&family=Secular+One&display=swap" rel="stylesheet">
<title>הדרך · סריקה</title>
<style>
  :root { --paper: #f3efe7; --ink: #1b1a17; --head: #d4553c; --ok: #7fd18b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--paper); overflow: hidden;
    font-family: "Heebo", -apple-system, "Helvetica Neue", Arial, sans-serif; overscroll-behavior: none; }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #hint { position: fixed; top: calc(env(safe-area-inset-top) + 16px); left: 16px; right: 16px; text-align: center;
    font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  footer { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); display: flex; gap: 8px; }
  footer button { flex: 1; font: inherit; font-size: 15px; padding: 12px 8px; border-radius: 10px;
    border: 1.5px solid var(--head); background: rgba(0,0,0,.35); color: var(--paper); }
  footer button.on { background: var(--head); color: #fff; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: var(--paper); color: var(--ink); padding: 24px; text-align: center; z-index: 10; }
  #start h1 { font-family: "Secular One", "Heebo", sans-serif; font-weight: 400; font-size: 73px; line-height: 1; margin: 0; }
  #start > :not(canvas) { position: relative; }
  #pulse { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #start p { margin: 0; color: #6d675c; max-width: 320px; line-height: 1.5; }
  #start button { font: inherit; font-size: 17px; padding: 11px 34px; border-radius: 11px; border: 0;
    background: var(--ink); color: var(--paper); }
  #start[hidden] { display: none; }
  #debug { position: fixed; top: calc(env(safe-area-inset-top) + 56px); left: 8px; z-index: 5; direction: ltr;
    background: rgba(27,26,23,.85); color: #f3efe7; font: 11px/1.45 ui-monospace, Menlo, monospace;
    padding: 6px 8px; border-radius: 8px; max-width: calc(100vw - 16px); max-height: 55vh; overflow: auto; }
  #debug button { font: inherit; min-width: 24px; margin: 1px; background: #f3efe7; color: #1b1a17; border: 0; border-radius: 4px; }
  #debug .row { display: flex; align-items: center; gap: 4px; }
  #debug .row span { flex: 1; }
  #debug canvas { display: block; width: 100%; max-height: 70px; object-fit: contain; margin-top: 4px; image-rendering: pixelated; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="overlay"></canvas>
<div id="hint"></div>
<footer>
  <button id="mode-play" class="on">ניגון מהנקודה</button>
  <button id="mode-glide">גרירה</button>
</footer>
<div id="start">
  <canvas id="pulse"></canvas>
  <h1>הדרך</h1>
  <p>כוון את הקו האדום לקעקוע ונגן את הדרך</p>
  <button id="go">התחל</button>
  <p id="err"></p>
</div>
<div id="debug" hidden></div>
<script src="js/reader.js?v=2"></script>
<script src="js/scan.js?v=16"></script>
</body>
</html>
