<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>הדרך</title>
<style>
  :root { --paper: #f3efe7; --ink: #1b1a17; --faint: #b9b2a5; --head: #b0412e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { padding: 20px 0 0; }
  h1 { font-weight: 400; font-size: 20px; margin: 0; letter-spacing: .02em; }
  .sub { color: #6d675c; font-size: 14px; margin-top: 4px; }
  #stage { flex: 1; position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
  #line { position: absolute; inset: 0; width: 100%; height: 100%; }
  #time { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-variant-numeric: tabular-nums;
    color: #6d675c; font-size: 14px; direction: ltr; }
  footer { display: flex; gap: 8px; padding: 12px 0 20px; }
  footer button { flex: 1; font: inherit; font-size: 15px; padding: 12px 8px; border-radius: 10px;
    border: 1px solid var(--ink); background: transparent; color: var(--ink); }
  footer button.on { background: var(--ink); color: var(--paper); }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #6d675c; }
  #status[hidden] { display: none; }
  #debug { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 8px; z-index: 5; direction: ltr;
    background: rgba(27,26,23,.88); color: #f3efe7; font: 12px/1.5 ui-monospace, Menlo, monospace;
    padding: 8px 10px; border-radius: 8px; max-width: calc(100vw - 16px); }
  #debug button { font: inherit; min-width: 26px; margin: 1px; background: #f3efe7; color: #1b1a17; border: 0; border-radius: 4px; }
  #debug .row { display: flex; align-items: center; gap: 4px; }
  #debug .row span { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>הדרך</h1>
  <div class="sub" id="hint">גע בקו כדי לשמוע את המקום הזה בדרך</div>
</header>
<div id="stage">
  <canvas id="line"></canvas>
  <div id="time"></div>
  <div id="status">טוען…</div>
</div>
<footer>
  <button id="mode-play" class="on">ניגון מהנקודה</button>
  <button id="mode-scrub">גרירה</button>
</footer>
<div id="debug" hidden></div>
<script src="js/app.js?v=2"></script>
</body>
</html>
